// بيانات المرافق
const commercials = [
  {
    title: "المرافق التجارية ",
    type: "مرفق تجاري",

    price: "التسليم في ٥ سنوات",

  },
  // أضف المزيد من المرافق هنا...
];

// دمج البيانات كلها
const units = [...apartments, ...villas, ...commercials];


let filtered = units;
let currentPage = 1;
const itemsPerPage = 24;

function renderPage(units) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  const start = (currentPage - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = units.slice(start, end);

  if (pageItems.length === 0) {
    resultsDiv.innerHTML = "<p class='text-center text-danger'>لا توجد نتائج مطابقة.</p>";
    return;
  }

  const cardsContainer = document.createElement('div');
  cardsContainer.className = 'cards';

  pageItems.forEach(unit => {
    const cardHTML = `
      <div class="card">
        <img src="${unit.image}" alt="${unit.title}">
        <div class="card-content">
          <h3>${unit.title}</h3>
          <p><span class="icon"><i class="fas fa-layer-group"></i></span> النوع: ${unit.type}</p>
          <p><span class="icon"><i class="fas fa-ruler-combined"></i></span> المساحة: ${unit.area} م²</p>
          <p><span class="icon"></span> <span class="highlight">${unit.price} </span></p>
        </div>
      </div>
    `;
    cardsContainer.innerHTML += cardHTML;
  });

  resultsDiv.appendChild(cardsContainer);
  renderPagination(units.length);
}

function renderPagination(totalItems) {
  const paginationDiv = document.getElementById("pagination");
  paginationDiv.innerHTML = "";

  const totalPages = Math.ceil(totalItems / itemsPerPage);
  if (totalPages <= 1) return;

  const navWrapper = document.createElement("div");
  navWrapper.className = "d-flex justify-content-center align-items-center gap-2 flex-wrap";

  // زر السابق
  const prevButton = document.createElement("button");
  prevButton.textContent = "السابق";
  prevButton.disabled = currentPage === 1;
  prevButton.className = "btn";
  prevButton.style.backgroundColor = currentPage === 1 ? "#aaa" : "#c02021";
  prevButton.style.color = "white";
  prevButton.style.borderRadius = "8px";
  prevButton.style.padding = "10px 20px";
  prevButton.onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      renderPage(filtered);
    }
  };
  navWrapper.appendChild(prevButton);

  // نص: صفحة x من y
  const pageInfo = document.createElement("span");
  pageInfo.textContent = `صفحة ${currentPage} من ${totalPages}`;
  pageInfo.style.fontWeight = "bold";
  pageInfo.style.color = "#c02021";
  navWrapper.appendChild(pageInfo);

  // زر التالي
  const nextButton = document.createElement("button");
  nextButton.textContent = "التالي";
  nextButton.disabled = currentPage === totalPages;
  nextButton.className = "btn";
  nextButton.style.backgroundColor = currentPage === totalPages ? "#aaa" : "#c02021";
  nextButton.style.color = "white";
  nextButton.style.borderRadius = "8px";
  nextButton.style.padding = "10px 20px";
  nextButton.onclick = () => {
    if (currentPage < totalPages) {
      currentPage++;
      renderPage(filtered);
    }
  };
  navWrapper.appendChild(nextButton);

  paginationDiv.appendChild(navWrapper);
}


function searchUnits() {
  const type = document.getElementById("typeSelect").value;
  const maxArea = parseInt(document.getElementById("areaRange").value);

  filtered = units.filter(unit => {
    return (type === "الكل" || unit.type === type) && unit.area <= maxArea;
  });

  currentPage = 1;
  renderPage(filtered);
}

window.onload = searchUnits;
</script>
